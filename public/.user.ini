; Upload limits for the site (PHP-FPM reads this file from the web root, re-checked every 5 minutes).
; Place files can be up to 50 MB and videos up to 100 MB, so allow a bit more than that per request.
upload_max_filesize = 110M
post_max_size = 120M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
